[project]
name = "sqlagent"
version = "2.0.0"
description = "Schema-agnostic natural-language-to-SQL agent built on LangGraph and Claude."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Leon Achata", email = "leonyemin@gmail.com" }]
dependencies = [
    "anthropic>=1.9,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "sqlalchemy>=2.0,<3",
    "sqlglot>=30,<31",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6,<7",
    "fastapi>=0.120,<1",
    "uvicorn[standard]>=0.30,<1",
    "typer>=0.15,<1",
    "rich>=13,<16",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
mysql = ["pymysql>=1.1,<2"]

[project.scripts]
sqlagent = "sqlagent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlagent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/sqlagent/cli.py" = ["B008"]  # typer declares options as default values

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
