# Execution-accuracy suite for the Chinook sample database (SQLite build).
# A case passes when the agent's result contains the gold result: every gold column must match
# some returned column (extra columns are fine), compared as a multiset of rows, or in order
# when `ordered: true`.
database_url: sqlite:///data/chinook.sqlite

cases:
  - id: count-customers
    question: How many customers are there?
    sql: SELECT COUNT(*) FROM Customer

  - id: count-tracks-rock
    question: How many tracks belong to the Rock genre?
    sql: |
      SELECT COUNT(*) FROM Track t JOIN Genre g ON g.GenreId = t.GenreId WHERE g.Name = 'Rock'

  - id: customers-brazil
    question: List the first and last names of all customers from Brazil.
    sql: SELECT FirstName, LastName FROM Customer WHERE Country = 'Brazil'

  - id: albums-acdc
    question: Which albums were released by AC/DC?
    sql: |
      SELECT al.Title FROM Album al JOIN Artist ar ON ar.ArtistId = al.ArtistId
      WHERE ar.Name = 'AC/DC'

  - id: revenue-total
    question: What is the total revenue across all invoices?
    sql: SELECT ROUND(SUM(Total), 2) FROM Invoice

  - id: revenue-by-country-top5
    question: Which 5 billing countries generated the most revenue, and how much each?
    ordered: true
    sql: |
      SELECT BillingCountry, ROUND(SUM(Total), 2) AS revenue FROM Invoice
      GROUP BY BillingCountry ORDER BY revenue DESC LIMIT 5

  - id: revenue-by-year
    question: Show total invoice revenue per year.
    ordered: true
    sql: |
      SELECT strftime('%Y', InvoiceDate) AS year, ROUND(SUM(Total), 2) FROM Invoice
      GROUP BY year ORDER BY year

  - id: top-artists-by-tracks
    question: Which 3 artists have the most tracks in the catalog?
    ordered: true
    sql: |
      SELECT ar.Name, COUNT(*) AS n FROM Track t
      JOIN Album al ON al.AlbumId = t.AlbumId JOIN Artist ar ON ar.ArtistId = al.ArtistId
      GROUP BY ar.ArtistId ORDER BY n DESC LIMIT 3

  - id: top-genres-by-sales
    question: What are the top 5 genres by number of tracks sold (sum of quantities)?
    ordered: true
    sql: |
      SELECT g.Name, SUM(il.Quantity) AS sold FROM InvoiceLine il
      JOIN Track t ON t.TrackId = il.TrackId JOIN Genre g ON g.GenreId = t.GenreId
      GROUP BY g.GenreId ORDER BY sold DESC LIMIT 5

  - id: best-customer
    question: Who is the customer that has spent the most money in total? Give their full name.
    sql: |
      SELECT c.FirstName, c.LastName FROM Customer c JOIN Invoice i ON i.CustomerId = c.CustomerId
      GROUP BY c.CustomerId ORDER BY SUM(i.Total) DESC LIMIT 1

  - id: employees-sales-agents
    question: List the names of employees whose title is Sales Support Agent.
    sql: |
      SELECT FirstName, LastName FROM Employee WHERE Title = 'Sales Support Agent'

  - id: sales-by-rep
    question: How much revenue is attributed to each sales support agent through their customers?
    sql: |
      SELECT e.FirstName, e.LastName, ROUND(SUM(i.Total), 2) FROM Employee e
      JOIN Customer c ON c.SupportRepId = e.EmployeeId JOIN Invoice i ON i.CustomerId = c.CustomerId
      GROUP BY e.EmployeeId

  - id: longest-track
    question: What is the name of the longest track?
    sql: SELECT Name FROM Track ORDER BY Milliseconds DESC LIMIT 1

  - id: avg-track-minutes-by-genre
    question: >-
      What is the average track length in minutes for the Jazz genre, rounded to two decimals?
    sql: |
      SELECT ROUND(AVG(t.Milliseconds) / 60000.0, 2) FROM Track t
      JOIN Genre g ON g.GenreId = t.GenreId WHERE g.Name = 'Jazz'

  - id: media-types-count
    question: How many tracks are there per media type?
    sql: |
      SELECT m.Name, COUNT(*) FROM Track t JOIN MediaType m ON m.MediaTypeId = t.MediaTypeId
      GROUP BY m.MediaTypeId

  - id: playlists-largest
    question: Which playlist contains the most tracks?
    sql: |
      SELECT p.Name FROM Playlist p JOIN PlaylistTrack pt ON pt.PlaylistId = p.PlaylistId
      GROUP BY p.PlaylistId ORDER BY COUNT(*) DESC LIMIT 1

  - id: artists-without-albums
    question: How many artists have no albums?
    sql: |
      SELECT COUNT(*) FROM Artist ar
      WHERE NOT EXISTS (SELECT 1 FROM Album al WHERE al.ArtistId = ar.ArtistId)

  - id: tracks-never-sold
    question: How many tracks have never been purchased?
    sql: |
      SELECT COUNT(*) FROM Track t
      WHERE NOT EXISTS (SELECT 1 FROM InvoiceLine il WHERE il.TrackId = t.TrackId)

  - id: customers-per-country-min5
    question: Which countries have at least 5 customers?
    sql: |
      SELECT Country FROM Customer GROUP BY Country HAVING COUNT(*) >= 5

  - id: invoices-2013-count
    question: How many invoices were issued in 2013?
    sql: SELECT COUNT(*) FROM Invoice WHERE strftime('%Y', InvoiceDate) = '2013'

  - id: avg-invoice-usa
    question: What is the average invoice total for customers billed in the USA, to 2 decimals?
    sql: SELECT ROUND(AVG(Total), 2) FROM Invoice WHERE BillingCountry = 'USA'

  - id: composer-most-tracks
    question: Which composer has written the most tracks (ignoring unknown composers)?
    sql: |
      SELECT Composer FROM Track WHERE Composer IS NOT NULL
      GROUP BY Composer ORDER BY COUNT(*) DESC LIMIT 1

  - id: manager-of-staff
    question: Who does Jane Peacock report to? Give the manager's full name.
    sql: |
      SELECT m.FirstName, m.LastName FROM Employee e JOIN Employee m ON m.EmployeeId = e.ReportsTo
      WHERE e.FirstName = 'Jane' AND e.LastName = 'Peacock'

  - id: monthly-revenue-2012
    question: Show revenue per month for 2012.
    ordered: true
    sql: |
      SELECT strftime('%m', InvoiceDate) AS month, ROUND(SUM(Total), 2) FROM Invoice
      WHERE strftime('%Y', InvoiceDate) = '2012' GROUP BY month ORDER BY month

  - id: expensive-tracks
    question: How many tracks cost more than 0.99?
    sql: SELECT COUNT(*) FROM Track WHERE UnitPrice > 0.99
